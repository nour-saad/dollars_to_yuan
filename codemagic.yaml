# =============================================================================
# Codemagic CI for dollars_to_yuan — builds & ships iOS WITHOUT a local Mac.
#
# How this works (no Mac needed on your side):
#   1. You push this repo to GitHub.
#   2. Codemagic (cloud Mac) runs: flutter pub get -> pod install -> analyze
#      -> test -> fetch signing -> build IPA -> upload to App Store Connect.
#   3. The IPA lands in TestFlight; you install it on your iPhone to verify
#      ads + RevenueCat premium before submitting for review.
#
# Prereqs (set up once, in the Codemagic web UI — see IOS_RELEASE_GUIDE.md):
#   - Connect your GitHub repo.
#   - Add the "App Store Connect" API integration (gives the APP_STORE_CONNECT_*
#     vars automatically). Your friend's paid Apple Developer account is used here.
#   - Automatic signing is DECLARED IN THIS FILE under environment.ios_signing
#     (no UI toggle needed). Codemagic auto-creates the Distribution certificate
#     + App Store provisioning profile for the bundle ID.
# =============================================================================

workflows:
  dollars_to_yuan_ios:
    name: Dollars To Yuan — iOS
    # mac_mini_m1 is the free-tier macOS instance on Codemagic.
    instance_type: mac_mini_m1
    max_build_duration: 60
    # Build only when you push to the branch you release from.
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true

    environment:
      # Pin to stable so the cloud Mac matches your local engine.
      # xcode "latest" ships CocoaPods/xcodeproj 1.27/1.28, which CAN parse this
      # (now clean) pbxproj's objectVersion 54. The earlier "unknown ISA XCConfigurationList"
      # failures were caused by a CORRUPTED pbxproj (a UUID collision where 97C14705 was
      # both an XCConfigurationList and a buildConfiguration); that is now regenerated.
      xcode: latest
      vars:
        # The bundle ID registered in the Apple Developer portal (must match
        # ios/Runner.xcodeproj/project.pbxproj exactly). Change in BOTH places.
        APP_STORE_CONNECT_BUNDLE_ID: "com.wcs.DollarsToYuan"
        XCODE_PROJECT: "ios/Runner.xcodeproj"
        XCODE_SCHEME: "Runner"
      # ---- iOS AUTOMATIC CODE SIGNING (declared here, no UI toggle needed) ----------
      # Codemagic reads this block, authenticates with the App Store Connect API key,
      # auto-creates the Distribution certificate + App Store provisioning profile for
      # the bundle ID, and exposes $CM_CERTIFICATE_PRIVATE_KEY / $CM_PROVISIONING_PROFILE /
      # $CM_EXPORT_OPTIONS_PATH. The three APP_STORE_CONNECT_* vars below are injected by
      # the App Store Connect API integration you added in the Codemagic UI.
      ios_signing:
        distribution_type: app_store        # -> App Store / TestFlight
        bundle_identifier: com.wcs.DollarsToYuan    # must match pbxproj + App Store Connect
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID

    scripts:
      - name: Fetch Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        # The ios/Podfile is required for google_mobile_ads & purchases_flutter.
        # With xcode "latest" the image's default CocoaPods parses our (now clean)
        # pbxproj, so a plain pod install is enough. No --repo-update needed.
        script: |
          cd ios
          pod install

      - name: Static analysis
        # These are info-level deprecation warnings (withOpacity, purchasePackage,
        # background), not errors. `flutter analyze` exits 1 on any info by default,
        # which would fail the build. --no-fatal-infos lets real errors still fail
        # the build while ignoring deprecation lints.
        script: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests
        script: flutter test

      - name: Build iOS IPA (release)
        # ios_signing (above) has already created the cert + provisioning profile
        # and exported them to $CM_EXPORT_OPTIONS_PATH.
        script: |
          flutter build ipa --release \
            --export-options-plist="$CM_EXPORT_OPTIONS_PATH"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - nouraldeen.saad@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        # Uploads the IPA to App Store Connect and pushes it to TestFlight.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
